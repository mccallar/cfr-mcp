name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The question or workflow you wish the server supported.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: >
        What a tool should return. Note that the server is retrieval-only —
        it returns regulation text, not compliance judgment or legal advice.
    validations:
      required: false
