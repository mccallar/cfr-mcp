name: Publish to MCP Registry

# The PyPI package must already be published (with the `mcp-name` marker in its
# README) before this runs — the registry validates ownership against the live
# PyPI description. Trigger on a version tag, or manually via workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to the registry — no stored secret needed
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Keep server.json version in sync with the tag
        if: github.ref_type == 'tag'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
